; SANKET — On-device Inference Firmware
; A Wrist-Worn ESP32-S3 TinyML System for Bangla Deaf-Aid Air-Written
; Gesture Recognition. This firmware runs the quantized int8 TFLite
; model directly on-chip (esp-tflite-micro + esp-nn ESP32-S3
; vector-ISA acceleration).
;
; Core 1 samples MPU6050 at 100 Hz into a 6 s ring buffer.
; Core 0 runs inference every 300 ms as a FreeRTOS task.
; Serial outputs: P,<class>,<confidence>  and  DETECTED,<class>,<conf>
;
; This is a SEPARATE project from firmware/ (the data logger).
; To go back to collecting data: `cd firmware && pio run -t upload`.

[env:esp32-s3-devkitc-1]
platform         = espressif32
board            = esp32-s3-devkitc-1
framework        = arduino
monitor_speed    = 921600
upload_speed     = 921600

board_build.flash_size         = 16MB
board_build.psram_type         = opi
board_build.arduino.memory_type= qio_opi
board_build.partitions         = default_16MB.csv

; Official Espressif ESP-TFLite-Micro (bundled with Arduino-ESP32 3.x).
; Has native esp-nn kernels for ESP32-S3 vector-instruction acceleration.
lib_deps =
    https://github.com/espressif/esp-tflite-micro.git

; TFLM uses placement-new with a private operator delete (to keep the heap
; out of play). Modern GCC's C++17 mode wants an implicit delete around
; placement-new unless exceptions are disabled. -fpermissive downgrades the
; private-access error so the TFLM sources compile cleanly.
build_unflags = -fexceptions
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DTF_LITE_STATIC_MEMORY
    -DESP_NN
    -DCONFIG_IDF_TARGET_ESP32S3=1
    -fno-exceptions
    -fpermissive
