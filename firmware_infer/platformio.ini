; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; TFLite-Micro comes precompiled with the Arduino-ESP32 framework
; (framework-arduinoespressif32-libs: espressif__esp-tflite-micro + esp-nn),
; so it is NOT listed in lib_deps — a second copy causes header conflicts.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
lib_deps =
   https://github.com/mamunul/BanglaText.git
   adafruit/Adafruit SSD1306 @ ^2.5.9
   adafruit/Adafruit GFX Library @ ^1.11.9
   dfrobot/DFRobotDFPlayerMini @ ^1.0.6

build_src_filter = +<*> -<test/>
build_unflags = -fexceptions
build_flags =
	-O2
	-DBOARD_HAS_PSRAM
	-fno-exceptions
	-fpermissive
	-Wno-unused-variable
	-Wno-unused-but-set-variable
	-I .pio/libdeps/esp32-s3-devkitc-1/BanglaText/src
	-I .pio/libdeps/esp32-s3-devkitc-1/BanglaText/examples/Example2
