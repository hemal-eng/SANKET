; SANKET — Data Logger Firmware
; A Wrist-Worn ESP32-S3 TinyML System for Bangla Deaf-Aid Air-Written
; Gesture Recognition. This firmware is used ONLY for data collection
; (one-shot 6 s gesture capture) via the Python GUI.
;
; Target: ESP32-S3-DevKitC-1 (N16R8, dual-USB black board)
; Uses the UART USB port (CH343/CP2102) for serial IO.

[env:esp32-s3-devkitc-1]
platform         = espressif32
board            = esp32-s3-devkitc-1
framework        = arduino
monitor_speed    = 921600
upload_speed     = 921600

board_build.flash_size   = 16MB
board_build.psram_type   = opi
board_build.arduino.memory_type = qio_opi

build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0           ; UART port (not native USB)
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
